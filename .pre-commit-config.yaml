repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff
        entry: bash -c 'cd backend && uv run ruff check --fix . && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: backend-mypy
        name: backend mypy
        entry: bash -c 'cd backend && uv run mypy app tests alembic scripts'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend-checks
        name: frontend prettier, oxlint, tsc
        entry: bash -c 'cd frontend && npx prettier --write . && npx oxlint && npx tsc -b'
        language: system
        files: ^frontend/
        pass_filenames: false
