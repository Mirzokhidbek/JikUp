# Production-style overrides: `docker compose -f docker-compose.yml -f docker-compose.demo.yml up`
# (or `make demo`). Built images only, no source mounts, migrations on start.

services:
  backend:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: !reset []

  worker:
    volumes: !reset []
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
    environment: !reset {}
    volumes: !reset []
    ports: !override
      - "127.0.0.1:8080:8080"
