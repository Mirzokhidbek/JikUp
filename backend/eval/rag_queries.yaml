# RAG eval set. Each case has:
#   expected: filters the query parser should extract (only listed keys are checked;
#             skills means "at least these skills").
#   relevant: a rule that marks postings as relevant. Relevant postings are computed
#             from the database, so the labels stay transparent and reproducible.
#             city / employment_type: exact; experience_max: posting minimum <= value
#             or no minimum; skills_any: has at least one; title_any: title contains
#             one of the words (case-insensitive).

- query: "Seulda Python bilan ishlaydigan, 2 yildan kam tajriba so'raydigan AI ishlarini top"
  expected: {city: 서울, skills: [Python], experience_max: 2}
  relevant:
    city: 서울
    experience_max: 2
    skills_any: [Python]
    title_any: [AI, ML, 머신러닝, 딥러닝, LLM, MLOps, 인공지능, 데이터 사이언]

- query: "React frontend developer jobs in Seoul"
  expected: {city: 서울, skills: [React]}
  relevant: {city: 서울, skills_any: [React], title_any: [프론트, Frontend, FE, 웹]}

- query: "판교 쿠버네티스 DevOps 엔지니어"
  expected: {city: 경기, skills: [Kubernetes]}
  relevant:
    city: 경기
    skills_any: [Kubernetes]
    title_any: [DevOps, SRE, 인프라, 플랫폼, 클라우드, 데브옵스]

- query: "Data engineer with Spark and Airflow"
  expected: {skills: [Airflow, Spark]}
  relevant:
    skills_any: [Spark, Airflow]
    title_any: [데이터 엔지니어, Data Engineer, 데이터 플랫폼, 파이프라인]

- query: "Busanda backend dasturchi ishlari"
